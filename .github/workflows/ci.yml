name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'
  COVERAGE_THRESHOLD: '85'

jobs:
  analyze:
    name: Lint & analyse statique
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver tool
      - name: Traductions générées à jour
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated
      - name: flutter analyze (aucun warning ni info toléré)
        run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Tests unitaires & widgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter test
        run: flutter test --coverage --reporter github
      - name: Seuil de couverture
        run: dart run tool/check_coverage.dart ${{ env.COVERAGE_THRESHOLD }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  integration:
    name: Tests d'intégration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances Linux desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb
      - run: flutter pub get
      # Un fichier à la fois : enchaîner plusieurs applications desktop dans
      # une même commande est instable (connexion au VM service).
      - name: Parcours utilisateur
        run: |
          for test in integration_test/app_flow_test.dart integration_test/settings_flow_test.dart; do
            xvfb-run -a flutter test "$test" -d linux
          done
      - name: Performance du défilement (mode profile)
        run: |
          xvfb-run -a flutter drive --profile -d linux \
            --driver=test_driver/perf_driver.dart \
            --target=integration_test/performance_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-timings
          path: build/scrolling.json
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.target }}
    needs: [analyze, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [apk, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK (release, un APK par ABI, obfusqué, symboles séparés)
        if: matrix.target == 'apk'
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --extra-gen-snapshot-options=--strip
      - name: Build Web (release)
        if: matrix.target == 'web'
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: miam-${{ matrix.target }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/symbols
            build/web
          if-no-files-found: ignore

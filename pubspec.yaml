name: miam
description: "Miam — carnet de recettes bilingue (FR/EN), testé et prêt pour la production."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  cached_network_image: ^4.0.4
  cupertino_icons: ^2.0.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  hooks_riverpod: ^3.4.3
  intl: any
  material_ui: ^1.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
